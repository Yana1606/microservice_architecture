name: Laboratory checks
on: [push, pull_request, workflow_dispatch]
jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: python3 scripts/check-commits.py
      - run: dotnet restore MathTournament.sln
      - run: dotnet build MathTournament.sln --no-restore
      - run: dotnet test tests/Tests.csproj --no-build --logger "trx;LogFileName=tests.trx" --results-directory test-results
      - run: dotnet run --project src/TwoPhaseLab/TwoPhaseLab.csproj --no-build
      - run: docker compose config --quiet
      - run: docker compose up --build --wait --wait-timeout 180
      - run: python3 scripts/demo.py ci-tournament
      - run: python3 scripts/check-http.py ci-tournament
      - run: python3 scripts/lab-demo.py all
      - if: always()
        run: docker compose logs > test-results/compose.log; docker compose down
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: test-results
